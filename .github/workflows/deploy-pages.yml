name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sync_run_id:
        description: Trilium sync run to receive the deployment result
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        if: needs.build.result == 'success'
        uses: actions/deploy-pages@v4

      - name: Checkout deployment reporter
        if: always() && inputs.sync_run_id != ''
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Record deployment result in Trilium
        if: always() && inputs.sync_run_id != ''
        continue-on-error: true
        run: node scripts/trilium/deploy-log.mjs
        env:
          TRILIUM_SERVER_URL: ${{ secrets.TRILIUM_SERVER_URL }}
          TRILIUM_ETAPI_TOKEN: ${{ secrets.TRILIUM_ETAPI_TOKEN }}
          SYNC_RUN_ID: ${{ inputs.sync_run_id }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome }}
          DEPLOY_BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
