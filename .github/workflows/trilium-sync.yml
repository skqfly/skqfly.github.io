name: Sync Trilium content

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: trilium-publish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TRILIUM_LOG_STATE: /tmp/trilium-log-${{ github.run_id }}.json
      TRILIUM_PLAN_FILE: /tmp/trilium-plan-${{ github.run_id }}.json
      TRILIUM_ERROR_FILE: /tmp/trilium-error-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check publication queue
        id: queue
        run: node scripts/trilium/queue.mjs
        env:
          TRILIUM_SERVER_URL: ${{ secrets.TRILIUM_SERVER_URL }}
          TRILIUM_ETAPI_TOKEN: ${{ secrets.TRILIUM_ETAPI_TOKEN }}
      - name: Start native sync log
        if: steps.queue.outputs.pending == 'true'
        continue-on-error: true
        run: node scripts/trilium/log.mjs start
        env:
          TRILIUM_SERVER_URL: ${{ secrets.TRILIUM_SERVER_URL }}
          TRILIUM_ETAPI_TOKEN: ${{ secrets.TRILIUM_ETAPI_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.queue.outputs.pending == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.queue.outputs.pending == 'true'
      - name: Test publishing rules
        if: steps.queue.outputs.pending == 'true'
        run: npm run trilium:check
      - name: Fetch and validate published content
        id: sync
        if: steps.queue.outputs.pending == 'true'
        run: |
          node scripts/trilium/log.mjs stage '读取与校验内容' || true
          node scripts/trilium/sync.mjs --queued
        env:
          TRILIUM_SERVER_URL: ${{ secrets.TRILIUM_SERVER_URL }}
          TRILIUM_ETAPI_TOKEN: ${{ secrets.TRILIUM_ETAPI_TOKEN }}
      - name: Build before pushing
        if: steps.sync.outputs.request != ''
        run: |
          node scripts/trilium/log.mjs stage '构建博客' || true
          npm run build
        env:
          TRILIUM_SERVER_URL: ${{ secrets.TRILIUM_SERVER_URL }}
          TRILIUM_ETAPI_TOKEN: ${{ secrets.TRILIUM_ETAPI_TOKEN }}
      - name: Commit content and trigger deployment
        if: steps.sync.outputs.request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRILIUM_SERVER_URL: ${{ secrets.TRILIUM_SERVER_URL }}
          TRILIUM_ETAPI_TOKEN: ${{ secrets.TRILIUM_ETAPI_TOKEN }}
        run: |
          node scripts/trilium/log.mjs stage '提交内容与触发部署' || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src/data/site.json src/data/photo-library.json src/content/posts trilium/published.json trilium/signals.json public/trilium-media
          if ! git diff --cached --quiet; then
            git commit -m 'Update blog content from Trilium'
            git push origin HEAD:main
          fi
          gh workflow run deploy-pages.yml --ref main --field sync_run_id="$GITHUB_RUN_ID"
      - name: Report result to Trilium
        if: always() && (steps.queue.outputs.pending == 'true' || failure())
        continue-on-error: true
        run: node scripts/trilium/log.mjs finish
        env:
          TRILIUM_RESULT: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
          TRILIUM_REQUEST: ${{ steps.sync.outputs.request }}
          TRILIUM_SERVER_URL: ${{ secrets.TRILIUM_SERVER_URL }}
          TRILIUM_ETAPI_TOKEN: ${{ secrets.TRILIUM_ETAPI_TOKEN }}
