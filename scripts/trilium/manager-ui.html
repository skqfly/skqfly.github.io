<style>
.blog-manager{--bm-line:color-mix(in srgb,currentColor 18%,transparent);--bm-muted:color-mix(in srgb,currentColor 65%,transparent);font:14px/1.55 system-ui,sans-serif;padding:24px;max-width:1400px;margin:auto;color:var(--main-text-color,inherit)}
.blog-manager *{box-sizing:border-box}.blog-manager h1{font-size:25px;margin:0}.blog-manager h2{font-size:19px;margin:0 0 14px}.blog-manager p{margin:6px 0 14px}.blog-manager .bm-muted{color:var(--bm-muted)}
.blog-manager button,.blog-manager .bm-button{font:inherit;border:1px solid var(--bm-line);border-radius:7px;padding:8px 13px;cursor:pointer;background:var(--button-background-color,transparent);color:inherit;text-decoration:none;display:inline-block}.blog-manager button:hover{background:color-mix(in srgb,currentColor 8%,transparent)}.blog-manager button:disabled{opacity:.5;cursor:wait}.blog-manager .bm-primary{background:#2762cc;color:white;border-color:#2762cc}.blog-manager .bm-primary:hover{background:#1d4faa}.blog-manager .bm-danger{color:#c73b3b}.blog-manager .bm-ghost{font-size:12px;padding:4px 8px}
.blog-manager .bm-header,.blog-manager .bm-actions,.blog-manager .bm-tabs,.blog-manager .bm-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.blog-manager .bm-header{justify-content:space-between;margin-bottom:18px}.blog-manager .bm-tabs{border-bottom:1px solid var(--bm-line);padding-bottom:12px;margin-bottom:18px}.blog-manager .bm-tabs button[aria-selected=true]{border-color:#2762cc;color:#2762cc;font-weight:650}.blog-manager .bm-status{min-height:25px;border-left:3px solid #2762cc;padding:8px 12px;margin-bottom:18px;background:color-mix(in srgb,#2762cc 8%,transparent)}.blog-manager .bm-status:empty{display:none}.blog-manager .bm-status[data-error=true]{border-color:#c73b3b}
.blog-manager .bm-layout{display:grid;grid-template-columns:minmax(210px,300px) minmax(0,1fr);gap:20px}.blog-manager .bm-list{display:flex;flex-direction:column;gap:7px;max-height:75vh;overflow:auto}.blog-manager .bm-record{text-align:left;display:flex;gap:10px;align-items:center;width:100%;padding:11px}.blog-manager .bm-record[aria-current=true]{border-color:#2762cc;background:color-mix(in srgb,#2762cc 7%,transparent)}.blog-manager .bm-record img{width:50px;height:50px;object-fit:cover;border-radius:6px}.blog-manager .bm-record span{min-width:0}.blog-manager .bm-record strong{display:block;overflow:hidden;text-overflow:ellipsis}.blog-manager .bm-badge{font-size:11px;font-weight:500;color:var(--bm-muted)}
.blog-manager label{font-weight:600;display:block;margin:0 0 12px}.blog-manager label input,.blog-manager label textarea,.blog-manager label select{font:inherit;display:block;width:100%;padding:9px 10px;margin-top:5px;border:1px solid var(--bm-line);border-radius:6px;background:var(--main-background-color,transparent);color:inherit}.blog-manager label textarea{min-height:95px;resize:vertical}.blog-manager label textarea.bm-body{min-height:280px;font:13px/1.65 ui-monospace,monospace}.blog-manager .bm-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.blog-manager .bm-fields .bm-wide{grid-column:1/-1}.blog-manager label small{font-weight:400;color:var(--bm-muted);display:block;margin-top:3px}.blog-manager .bm-preview{display:block;max-width:100%;max-height:210px;object-fit:contain;border-radius:8px;border:1px solid var(--bm-line);margin:8px 0}.blog-manager .bm-image-tools{border:1px solid var(--bm-line);border-radius:8px;padding:12px;margin-bottom:14px}.blog-manager .bm-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}.blog-manager .bm-media{border:1px solid var(--bm-line);border-radius:9px;padding:10px;min-width:0}.blog-manager .bm-media img{width:100%;height:130px;object-fit:cover;border-radius:5px}.blog-manager .bm-media strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:6px 0}.blog-manager .bm-photo-pick{display:flex;gap:12px;flex-wrap:wrap}.blog-manager .bm-photo-pick label{font-weight:400;max-width:110px}.blog-manager .bm-photo-pick img{width:95px;height:75px;object-fit:cover;display:block;border-radius:5px}.blog-manager .bm-photo-pick input{width:auto;display:inline}.blog-manager .bm-toolbar{margin-bottom:15px}.blog-manager .bm-toolbar input{font:inherit;padding:8px;border:1px solid var(--bm-line);border-radius:7px;background:transparent;color:inherit}.blog-manager details{margin:14px 0}.blog-manager summary{cursor:pointer;color:var(--bm-muted)}
@media(max-width:750px){.blog-manager{padding:14px}.blog-manager .bm-layout{grid-template-columns:1fr}.blog-manager .bm-list{max-height:230px}.blog-manager .bm-fields{grid-template-columns:1fr}.blog-manager .bm-header h1{font-size:22px}}
</style>

  <div class="bm-toolbar"></div>

</section>
